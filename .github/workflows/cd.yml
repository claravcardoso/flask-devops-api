name: CD - Entrega Contínua

on:
  workflow_run:
    workflows:
      - CI - Integração Contínua
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy na Amazon EC2
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código aprovado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Criar chave SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

      - name: Registrar host da EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Enviar arquivos para a EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          tar -czf deploy.tar.gz app scripts/deploy.sh Dockerfile requirements.txt docker-compose.yml
          scp -i ~/.ssh/ec2_key.pem deploy.tar.gz "${EC2_USER}@${EC2_HOST}:/tmp/deploy.tar.gz"

      - name: Executar deploy remoto
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_VERSION: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem "${EC2_USER}@${EC2_HOST}" "
            mkdir -p /opt/flask-devops-api &&
            tar -xzf /tmp/deploy.tar.gz -C /opt/flask-devops-api &&
            cd /opt/flask-devops-api &&
            chmod +x scripts/deploy.sh &&
            APP_VERSION=${APP_VERSION} ./scripts/deploy.sh
          "

      - name: Testar a aplicação
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --retry 5 --retry-delay 5 "http://${EC2_HOST}/health"

      - name: Limpar chave temporária
        if: always()
        run: rm -f ~/.ssh/ec2_key.pem deploy.tar.gz