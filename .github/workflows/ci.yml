name: CI - Integração Contínua

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes e validações
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar sintaxe Python
        run: python -m compileall app tests

      - name: Executar testes automatizados
        run: pytest -v

      - name: Instalar ferramenta de auditoria
        run: pip install pip-audit

      - name: Auditar dependências
        run: pip-audit -r requirements.txt

  docker:
    name: Construção da imagem Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t flask-devops-api:${{ github.sha }} .

      - name: Executar container para validação
        run: |
          docker run \
            --name flask-devops-api-test \
            -p 5000:5000 \
            -d \
            flask-devops-api:${{ github.sha }}

      - name: Aguardar inicialização
        run: sleep 10

      - name: Testar health check
        run: curl --fail http://localhost:5000/health

      - name: Mostrar logs em caso de falha
        if: failure()
        run: docker logs flask-devops-api-test

      - name: Remover container de teste
        if: always()
        run: docker rm -f flask-devops-api-test

        ##
